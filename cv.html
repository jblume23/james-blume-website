<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curriculum vitae">
  <title>CV</title>
  <link rel="stylesheet" href="styles.css">
  <script src="cv.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-name" href="index.html">Your Name</a>
      <nav aria-label="Primary navigation">
        <ul class="site-nav">
          <li><a href="index.html">About</a></li>
          <li><a href="research.html">Research</a></li>
          <li><a href="cv.html" aria-current="page">CV</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="cv-section" aria-labelledby="cv-heading">
      <div class="cv-heading-row">
        <div>
          <h1 id="cv-heading">Curriculum Vitae</h1>
          <p class="cv-note">The PDF is displayed below.</p>
        </div>

        <div class="cv-actions" aria-label="CV actions">
          <a
            id="cv-fullscreen-link"
            class="button button--primary"
            href="files/cv.pdf"
            target="_blank"
            rel="noopener noreferrer"
          >View full screen</a>
          <a
            id="cv-download-link"
            class="button"
            href="files/cv.pdf"
            download="cv.pdf"
          >Download PDF</a>
        </div>
      </div>

      <div class="pdf-frame-wrap" id="pdf-frame-wrap">
        <div class="pdf-status" id="pdf-status" role="status" aria-live="polite">
          Loading CV…
        </div>

        <iframe
          id="cv-pdf-frame"
          class="pdf-frame"
          title="Curriculum vitae PDF"
          src="about:blank"
          loading="eager"
          allow="fullscreen"
        ></iframe>

        <noscript>
          <p class="pdf-fallback">
            JavaScript is disabled. Open the
            <a href="files/cv.pdf" target="_blank" rel="noopener noreferrer">CV PDF</a>
            or <a href="files/cv.pdf" download="cv.pdf">download it</a>.
          </p>
        </noscript>
      </div>
    </section>
  </main>
</body>
</html>
