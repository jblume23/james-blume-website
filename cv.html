<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curriculum vitae of INSERT NAME HERE">
  <title>CV | INSERT NAME HERE</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="site-shell header-inner">
      <a class="site-name" href="index.html">INSERT NAME HERE</a>

      <button class="nav-toggle" type="button"
              aria-expanded="false"
              aria-controls="site-navigation"
              aria-label="Open navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a class="active" href="cv.html" aria-current="page">CV</a>
      </nav>
    </div>
  </header>

  <main class="site-shell page-content cv-page-content">
    <header class="page-heading cv-heading">
      <div>
        <h1>Curriculum Vitae</h1>
        <p class="cv-updated">Last updated: INSERT DATE HERE</p>
      </div>

      <div class="cv-actions" aria-label="CV options">
        <a id="cv-fullscreen-link"
           href="files/cv.pdf"
           target="_blank"
           rel="noopener noreferrer">
          View full screen
        </a>
        <a id="cv-download-link"
           href="files/cv.pdf"
           download>
          Download PDF
        </a>
      </div>
    </header>

    <section class="cv-viewer-section" aria-label="Embedded curriculum vitae">
      <div class="cv-viewer-shell">
        <p class="cv-viewer-status" id="cv-viewer-status" role="status">
          Loading CV…
        </p>

        <iframe
          class="cv-pdf-frame"
          id="cv-pdf-frame"
          title="Curriculum vitae PDF"
          src="files/cv.pdf#view=FitH&toolbar=1&navpanes=0"
          loading="eager">
        </iframe>
      </div>

      <noscript>
        <p class="cv-viewer-fallback">
          JavaScript is disabled. You can still
          <a href="files/cv.pdf" target="_blank" rel="noopener noreferrer">view the PDF</a>.
        </p>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-shell footer-inner">
      <span>INSERT NAME HERE</span>
      <span>
        <a href="mailto:INSERT-EMAIL-HERE">Email</a>
        · © <span data-current-year></span>
      </span>
    </div>
  </footer>
</body>
</html>
